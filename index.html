<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Coding Workspace</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html, body {
    height: 100%;
    overflow: hidden;
    background: #1e1e1e;
}

.workspace {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Top Bar */

.toolbar {
    height: 50px;
    min-height: 50px;
    background: #252526;
    border-bottom: 1px solid #3a3a3a;
}

/* Main Layout */

.content {
    flex: 1;
    display: flex;
    overflow: hidden;
}

/* Code Editor */

.editor-container {
    flex: 3;
    border-right: 1px solid #333;
    background: #1e1e1e;
}

.editor {
    width: 100%;
    height: 100%;
    resize: none;

    background: #1e1e1e;
    color: #d4d4d4;

    border: none;
    outline: none;

    font-family: "Consolas", monospace;
    font-size: 15px;

    padding: 20px;
}

/* Terminal */

.terminal-container {
    flex: 2;
    background: #111;
    display: flex;
    flex-direction: column;
}

.terminal-header {
    padding: 10px 15px;
    background: #1c1c1c;
    border-bottom: 1px solid #333;
    color: white;
}

.terminal-output {
    flex: 1;
    overflow-y: auto;

    padding: 15px;

    color: #00ff88;
    font-family: Consolas, monospace;
}

.terminal-input {
    background: #181818;
    border-top: 1px solid #333;
    padding: 10px;
}

.terminal-input input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-family: Consolas, monospace;
}

/* Assignment Drawer */

.assignment-panel {
    position: fixed;

    top: 50px;
    right: -450px;

    width: 450px;
    height: calc(100vh - 50px);

    background: #252526;
    border-left: 1px solid #444;

    transition: right .3s ease;
    z-index: 1000;

    box-shadow: -10px 0 30px rgba(0,0,0,.4);

    display: flex;
    flex-direction: column;
}

.assignment-panel.open {
    right: 0;
}

.assignment-header {
    padding: 16px;
    border-bottom: 1px solid #444;
}

.assignment-body {
    padding: 16px;
    overflow-y: auto;
    color: #ddd;
}

.assignment-body pre {
    background: #1b1b1b;
    padding: 12px;
    border-radius: 8px;
}

/* Mobile */

@media (max-width: 768px) {
    .content {
        flex-direction: column;
    }

    .editor-container {
        flex: 2;
    }

    .terminal-container {
        flex: 1;
    }

    .assignment-panel {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="workspace">

    <div class="toolbar d-flex align-items-center px-3">

        <strong class="text-light">
            challenge.py
        </strong>

        <div class="ms-auto">

            <button
                class="btn btn-outline-info btn-sm me-2"
                onclick="toggleAssignment()">
                Task
            </button>

            <button
                class="btn btn-success btn-sm"
                onclick="runCode()">
                Run
            </button>

        </div>

    </div>

    <div class="content">

        <!-- EDITOR -->

        <div class="editor-container">

<textarea class="editor">
def solve():
    pass

if __name__ == "__main__":
    solve()
</textarea>

        </div>

        <!-- TERMINAL -->

        <div class="terminal-container">

            <div class="terminal-header">
                Terminal
            </div>

            <div id="output" class="terminal-output">
Welcome to the terminal.

$
            </div>

            <div class="terminal-input">
                <input
                    placeholder="Enter command..."
                    onkeydown="handleCommand(event)">
            </div>

        </div>

    </div>

</div>

<!-- Assignment Drawer -->

<div id="assignmentPanel" class="assignment-panel">

    <div class="assignment-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0 text-light">
            Assignment
        </h5>

        <button
            class="btn btn-sm btn-outline-light"
            onclick="toggleAssignment()">
            ✕
        </button>

    </div>

    <div class="assignment-body">

        <h4>Factorial Challenge</h4>

        <p>
            Write a function that computes the
            factorial of an integer n.
        </p>

        <h6>Input</h6>

        <pre>5</pre>

        <h6>Expected Output</h6>

        <pre>120</pre>

        <h6>Requirements</h6>

        <ul>
            <li>No recursion</li>
            <li>Use a loop</li>
            <li>Handle n = 0</li>
        </ul>

    </div>

</div>

<script>
function toggleAssignment() {
    document
        .getElementById("assignmentPanel")
        .classList
        .toggle("open");
}

function runCode() {
    const output =
        document.getElementById("output");

    output.innerHTML +=
        "<br>$ run" +
        "<br>Program executed.<br>";
}

function handleCommand(event) {

    if (event.key === "Enter") {

        const text = event.target.value;

        document.getElementById("output").innerHTML +=
            "<br>$ " + text;

        event.target.value = "";
    }
}
</script>

</body>
</html>
